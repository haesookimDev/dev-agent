[project]
name = "kelpie-vm-runner"
version = "0.1.0"
description = "VM-side Codex runner for Kelpie"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[project.scripts]
kelpie-runner = "kelpie_runner.main:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kelpie_runner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
