name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: kelpie_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d kelpie_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/runner/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e './apps/api[dev]' -e './apps/runner[dev]'
      - name: Test and lint Python
        run: |
          make test-api test-runner PYTHON=python
          python -m ruff check apps/api/app apps/api/tests apps/runner/kelpie_runner apps/runner/tests
      - name: Verify PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci-test-only@127.0.0.1:5432/kelpie_ci
        run: |
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m alembic -c apps/api/alembic.ini check
          python -m alembic -c apps/api/alembic.ini downgrade -1
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m alembic -c apps/api/alembic.ini check

      - name: Verify worker credential isolation under PostgreSQL locks
        env:
          KELPIE_TEST_POSTGRES_URL: postgresql+asyncpg://ci:ci-test-only@127.0.0.1:5432/kelpie_ci
        run: python -m pytest -q apps/api/tests/test_worker_postgres.py

      - name: Verify append-only audit guards under PostgreSQL
        env:
          KELPIE_TEST_POSTGRES_URL: postgresql+asyncpg://ci:ci-test-only@127.0.0.1:5432/kelpie_ci
        run: python -m pytest -q apps/api/tests/test_audit_postgres.py

      - name: Verify cancellation and Claim races under PostgreSQL
        env:
          KELPIE_TEST_POSTGRES_URL: postgresql+asyncpg://ci:ci-test-only@127.0.0.1:5432/kelpie_ci
        run: python -m pytest -q apps/api/tests/test_cancellation_postgres.py

      - name: Verify runtime observation aggregates under PostgreSQL
        env:
          KELPIE_TEST_POSTGRES_URL: postgresql+asyncpg://ci:ci-test-only@127.0.0.1:5432/kelpie_ci
        run: python -m pytest -q apps/api/tests/test_runtime_health.py

  go:
    name: Go
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/worker/go.mod
          # Both modules currently use only the standard library, without go.sum.
          cache: false
      - name: Test and vet Go
        run: |
          make test-worker test-gateway
          (cd apps/worker && go vet ./...)
          (cd apps/gateway && go vet ./...)
      - name: Cache pinned promtool archive
        id: promtool-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/kelpie-prometheus-3.14.0.tar.gz
          key: promtool-linux-amd64-3.14.0-f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d
      - name: Download promtool on cache miss
        if: steps.promtool-cache.outputs.cache-hit != 'true'
        run: >-
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2
          --retry 2 --connect-timeout 10 --max-time 90
          --output "$RUNNER_TEMP/kelpie-prometheus-3.14.0.tar.gz"
          https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-amd64.tar.gz
      - name: Verify and test alert rules
        run: |
          printf '%s  %s\n' 'f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d' "$RUNNER_TEMP/kelpie-prometheus-3.14.0.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/kelpie-prometheus-3.14.0.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 prometheus-3.14.0.linux-amd64/promtool
          make test-monitoring PROMTOOL="$RUNNER_TEMP/promtool"

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix apps/web
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/worker/go.mod
          cache: false
      - name: Install browser-test services
        run: python -m pip install -e ./apps/api
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      - name: Install Chromium
        run: npx --prefix apps/web playwright install --with-deps chromium
      - name: Test, lint and build Web
        run: |
          make test-web
          npm run lint --prefix apps/web
          npm run build --prefix apps/web
      - name: Run browser acceptance
        env:
          KELPIE_E2E_PYTHON: python
        run: npm run test:e2e --prefix apps/web
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-evidence
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
