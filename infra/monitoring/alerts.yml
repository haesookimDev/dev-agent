groups:
  - name: kelpie-control-plane
    interval: 30s
    rules:
      - alert: KelpieApiScrapeUnavailable
        expr: up{job="kelpie-api"} == 0
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: Kelpie API metrics cannot be scraped
          summary_ko: Kelpie API 지표를 수집할 수 없습니다
          runbook_url: https://github.com/haesookimDev/dev-agent/blob/main/docs/en/monitoring-alerts.md#api-scrape
          runbook_url_ko: https://github.com/haesookimDev/dev-agent/blob/main/docs/ko/monitoring-alerts.md#api-scrape

      - alert: KelpieApiTargetMissing
        expr: absent(up{job="kelpie-api"})
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: No Kelpie API scrape target is present
          summary_ko: Kelpie API 수집 대상이 없습니다
          runbook_url: https://github.com/haesookimDev/dev-agent/blob/main/docs/en/monitoring-alerts.md#missing-target
          runbook_url_ko: https://github.com/haesookimDev/dev-agent/blob/main/docs/ko/monitoring-alerts.md#missing-target

      - alert: KelpieRecoveryMetricsMissing
        expr: |
          (up{job="kelpie-api"} == 1)
          unless on (job, instance)
          kelpie_delivery_startup_recovery_state{
            job="kelpie-api", kelpie_delivery_startup_recovery_state="completed"
          }
        for: 2m
        labels:
          severity: warning
          component: api
        annotations:
          summary: Kelpie startup recovery metrics are missing
          summary_ko: Kelpie 시작 시 전달 복구 지표가 누락됐습니다
          runbook_url: https://github.com/haesookimDev/dev-agent/blob/main/docs/en/monitoring-alerts.md#missing-metrics
          runbook_url_ko: https://github.com/haesookimDev/dev-agent/blob/main/docs/ko/monitoring-alerts.md#missing-metrics

      - alert: KelpieStartupRecoveryStalled
        # Remove the phase label so phase changes do not restart the pending timer.
        expr: |
          (sum without (kelpie_delivery_startup_recovery_state) (
            kelpie_delivery_startup_recovery_state{
              job="kelpie-api", kelpie_delivery_startup_recovery_state!="completed"
            }
          ) == 1)
          and on (job, instance) (up{job="kelpie-api"} == 1)
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: Kelpie startup delivery recovery has not completed for five minutes
          summary_ko: Kelpie 시작 시 전달 복구가 5분 동안 완료되지 않았습니다
          runbook_url: https://github.com/haesookimDev/dev-agent/blob/main/docs/en/monitoring-alerts.md#startup-recovery
          runbook_url_ko: https://github.com/haesookimDev/dev-agent/blob/main/docs/ko/monitoring-alerts.md#startup-recovery

      - alert: KelpieDeliveryFailures
        expr: |
          (sum without (outcome) (
            increase(kelpie_delivery_outcomes_total{job="kelpie-api", outcome="failed"}[10m])
          ) > 0)
          and on (job, instance) (up{job="kelpie-api"} == 1)
        labels:
          severity: warning
          component: api
        annotations:
          summary: Kelpie delivery failures were observed in the last ten minutes
          summary_ko: 최근 10분 동안 Kelpie 전달 실패가 관찰됐습니다
          runbook_url: https://github.com/haesookimDev/dev-agent/blob/main/docs/en/monitoring-alerts.md#delivery-failures
          runbook_url_ko: https://github.com/haesookimDev/dev-agent/blob/main/docs/ko/monitoring-alerts.md#delivery-failures

      # Keep the freshness/contract gate in one rule for all runtime alerts.
      # An absent or partially relabeled observation must not look healthy.
      - record: kelpie:runtime_snapshot_usable
        expr: |
          (kelpie_runtime_snapshot_available{job="kelpie-api"} == 1)
          and on (job, instance) (up{job="kelpie-api"} == 1)
          and on (job, instance) (kelpie_runtime_snapshot_age_seconds{job="kelpie-api"} >= 0)
          and on (job, instance) (kelpie_runtime_snapshot_age_seconds{job="kelpie-api"} <= 30)
          and on (job, instance) (count by (job, instance) (
            kelpie_runtime_workers{job="kelpie-api",state=~"online|draining|offline|quarantined"} >= 0
          ) == 4)
          and on (job, instance) (count by (job, instance) (
            kelpie_runtime_leases{job="kelpie-api",state=~"active|expired"} >= 0
          ) == 2)
          and on (job, instance) (kelpie_runtime_queued_work{job="kelpie-api"} >= 0)
          and on (job, instance) (kelpie_runtime_queue_oldest_age_seconds{job="kelpie-api"} >= 0)

      - alert: KelpieRuntimeObservationUnavailable
        expr: |
          (up{job="kelpie-api"} == 1)
          unless on (job, instance) kelpie:runtime_snapshot_usable{job="kelpie-api"}
        for: 2m
        labels:
          severity: warning
          component: api
        annotations:
          summary: Kelpie runtime observation is failed, stale, or incomplete
          summary_ko: Kelpie 실행 상태 관측이 실패했거나 오래됐거나 누락됐습니다
          runbook_url: https://github.com/haesookimDev/dev-agent/blob/main/docs/en/runtime-monitoring.md#observation
          runbook_url_ko: https://github.com/haesookimDev/dev-agent/blob/main/docs/ko/runtime-monitoring.md#observation

      - alert: KelpieWorkerHeartbeatLost
        expr: |
          (sum without (state) (kelpie_runtime_workers{job="kelpie-api",state="offline"}) > 0)
          and on (job, instance) kelpie:runtime_snapshot_usable{job="kelpie-api"}
        for: 2m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: Kelpie has offline workers or lost heartbeats
          summary_ko: Kelpie Worker가 오프라인이거나 Heartbeat가 끊겼습니다
          runbook_url: https://github.com/haesookimDev/dev-agent/blob/main/docs/en/runtime-monitoring.md#heartbeat
          runbook_url_ko: https://github.com/haesookimDev/dev-agent/blob/main/docs/ko/runtime-monitoring.md#heartbeat

      - alert: KelpieActiveLeaseExpired
        expr: |
          (sum without (state) (kelpie_runtime_leases{job="kelpie-api",state="expired"}) > 0)
          and on (job, instance) kelpie:runtime_snapshot_usable{job="kelpie-api"}
        for: 2m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: Kelpie has expired lease records that are still active
          summary_ko: Kelpie에 만료됐지만 활성 상태로 남은 Lease가 있습니다
          runbook_url: https://github.com/haesookimDev/dev-agent/blob/main/docs/en/runtime-monitoring.md#lease
          runbook_url_ko: https://github.com/haesookimDev/dev-agent/blob/main/docs/ko/runtime-monitoring.md#lease

      - alert: KelpieWorkQueueStalled
        expr: |
          (kelpie_runtime_queue_oldest_age_seconds{job="kelpie-api"} > 600)
          and on (job, instance) (kelpie_runtime_queued_work{job="kelpie-api"} > 0)
          and on (job, instance) kelpie:runtime_snapshot_usable{job="kelpie-api"}
        for: 2m
        labels:
          severity: warning
          component: api
        annotations:
          summary: Kelpie work has remained queued for more than ten minutes
          summary_ko: Kelpie 작업이 10분 넘게 대기열에 남아 있습니다
          runbook_url: https://github.com/haesookimDev/dev-agent/blob/main/docs/en/runtime-monitoring.md#queue
          runbook_url_ko: https://github.com/haesookimDev/dev-agent/blob/main/docs/ko/runtime-monitoring.md#queue

      # Extend observation separately: older Worker/queue alerts remain useful
      # when just the new execution series are missing during an API rollout.
      - record: kelpie:execution_snapshot_usable
        expr: |
          kelpie:runtime_snapshot_usable{job="kelpie-api"}
          and on (job, instance) (count by (job, instance) (
            count by (job, instance, state) (
              (kelpie_runtime_execution_work{job="kelpie-api",state=~"provisioning|analyzing|implementing|verifying|committing|pr_created"} >= 0) < Inf
            ) == 1
          ) == 6)
          and on (job, instance) (count by (job, instance) (
            count by (job, instance, state) (
              (kelpie_runtime_execution_oldest_update_age_seconds{job="kelpie-api",state=~"provisioning|analyzing|implementing|verifying|committing|pr_created"} >= 0) < Inf
            ) == 1
          ) == 6)
          and on (job, instance) (count by (job, instance) (
            count by (job, instance, state) (
              (kelpie_runtime_delivery_jobs{job="kelpie-api",state=~"pending|retry|running|completed|failed|unknown"} >= 0) < Inf
            ) == 1
          ) == 6)
          and on (job, instance) (count by (job, instance) (
            count by (job, instance, state) (
              (kelpie_runtime_delivery_oldest_update_age_seconds{job="kelpie-api",state=~"pending|retry|running|completed|failed|unknown"} >= 0) < Inf
            ) == 1
          ) == 6)

      - alert: KelpieExecutionObservationUnavailable
        expr: |
          kelpie:runtime_snapshot_usable{job="kelpie-api"}
          unless on (job, instance) kelpie:execution_snapshot_usable{job="kelpie-api"}
        for: 2m
        labels:
          severity: warning
          component: api
        annotations:
          summary: Kelpie execution or delivery observations are invalid or incomplete
          summary_ko: Kelpie 실행 단계 또는 전달 관측 지표가 유효하지 않거나 누락됐습니다
          runbook_url: https://github.com/haesookimDev/dev-agent/blob/main/docs/en/execution-monitoring.md#observation
          runbook_url_ko: https://github.com/haesookimDev/dev-agent/blob/main/docs/ko/execution-monitoring.md#observation

      - alert: KelpieExecutionPhaseStalled
        expr: |
          (
            kelpie_runtime_execution_oldest_update_age_seconds{job="kelpie-api",state=~"provisioning|committing|pr_created"} > 600
            or kelpie_runtime_execution_oldest_update_age_seconds{job="kelpie-api",state=~"analyzing|implementing|verifying"} > 1800
          )
          and on (job, instance, state) (kelpie_runtime_execution_work{job="kelpie-api"} > 0)
          and on (job, instance) kelpie:execution_snapshot_usable{job="kelpie-api"}
        for: 2m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: A Kelpie execution phase has exceeded its metadata update-age threshold
          summary_ko: Kelpie 실행 단계의 마지막 메타데이터 갱신 이후 시간이 기준을 넘었습니다
          runbook_url: https://github.com/haesookimDev/dev-agent/blob/main/docs/en/execution-monitoring.md#execution
          runbook_url_ko: https://github.com/haesookimDev/dev-agent/blob/main/docs/ko/execution-monitoring.md#execution

      - alert: KelpieDeliveryJobStalled
        expr: |
          (kelpie_runtime_delivery_oldest_update_age_seconds{job="kelpie-api",state=~"pending|retry|running|unknown"} > 600)
          and on (job, instance, state) (kelpie_runtime_delivery_jobs{job="kelpie-api"} > 0)
          and on (job, instance) kelpie:execution_snapshot_usable{job="kelpie-api"}
        for: 2m
        labels:
          severity: warning
          component: api
        annotations:
          summary: A Kelpie delivery job has remained unfinished without a metadata update for ten minutes
          summary_ko: Kelpie 미완료 전달 작업이 메타데이터 갱신 없이 10분 넘게 남아 있습니다
          runbook_url: https://github.com/haesookimDev/dev-agent/blob/main/docs/en/execution-monitoring.md#delivery
          runbook_url_ko: https://github.com/haesookimDev/dev-agent/blob/main/docs/ko/execution-monitoring.md#delivery
