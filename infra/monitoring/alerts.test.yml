rule_files:
  - alerts.yml
evaluation_interval: 30s

tests:
  - name: scrape outage waits two minutes and clears on recovery
    interval: 30s
    input_series:
      - series: 'up{job="kelpie-api",instance="api:8000"}'
        values: '0x5 1x4'
    alert_rule_test:
      - eval_time: 1m30s
        alertname: KelpieApiScrapeUnavailable
        exp_alerts: []
      - eval_time: 2m
        alertname: KelpieApiScrapeUnavailable
        exp_alerts:
          - exp_labels:
              job: kelpie-api
              instance: api:8000
              severity: critical
              component: api
            exp_annotations:
              summary: Kelpie API metrics cannot be scraped
              summary_ko: Kelpie API 지표를 수집할 수 없습니다
              runbook_url: https://github.com/haesookimDev/dev-agent/blob/main/docs/en/monitoring-alerts.md#api-scrape
              runbook_url_ko: https://github.com/haesookimDev/dev-agent/blob/main/docs/ko/monitoring-alerts.md#api-scrape
      - eval_time: 2m
        alertname: KelpieApiTargetMissing
        exp_alerts: []
      - eval_time: 2m
        alertname: KelpieRecoveryMetricsMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: KelpieApiScrapeUnavailable
        exp_alerts: []

  - name: missing target is not a healthy empty result or another job
    input_series:
      - series: 'up{job="other-api",instance="api:8000"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 1m30s
        alertname: KelpieApiTargetMissing
        exp_alerts: []
      - eval_time: 2m
        alertname: KelpieApiTargetMissing
        exp_alerts:
          - exp_labels: {job: kelpie-api, severity: critical, component: api}
            exp_annotations:
              summary: No Kelpie API scrape target is present
              summary_ko: Kelpie API 수집 대상이 없습니다
              runbook_url: https://github.com/haesookimDev/dev-agent/blob/main/docs/en/monitoring-alerts.md#missing-target
              runbook_url_ko: https://github.com/haesookimDev/dev-agent/blob/main/docs/ko/monitoring-alerts.md#missing-target
      - eval_time: 2m
        alertname: KelpieApiScrapeUnavailable
        exp_alerts: []
      - eval_time: 2m
        alertname: KelpieRecoveryMetricsMissing
        exp_alerts: []

  - name: successful scrape must contain recovery contract
    input_series:
      - series: 'up{job="kelpie-api",instance="api:8000"}'
        values: '1x10'
      - series: 'kelpie_delivery_startup_recovery_state{job="other-api",instance="api:8000",kelpie_delivery_startup_recovery_state="completed"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 1m30s
        alertname: KelpieRecoveryMetricsMissing
        exp_alerts: []
      - eval_time: 2m
        alertname: KelpieRecoveryMetricsMissing
        exp_alerts:
          - exp_labels: {job: kelpie-api, instance: 'api:8000', severity: warning, component: api}
            exp_annotations:
              summary: Kelpie startup recovery metrics are missing
              summary_ko: Kelpie 시작 시 전달 복구 지표가 누락됐습니다
              runbook_url: https://github.com/haesookimDev/dev-agent/blob/main/docs/en/monitoring-alerts.md#missing-metrics
              runbook_url_ko: https://github.com/haesookimDev/dev-agent/blob/main/docs/ko/monitoring-alerts.md#missing-metrics

  - name: phase transitions retain the five minute pending timer and completion clears it
    input_series:
      - series: 'up{job="kelpie-api",instance="api:8000"}'
        values: '1x16'
      - series: 'kelpie_delivery_startup_recovery_state{job="kelpie-api",instance="api:8000",kelpie_delivery_startup_recovery_state="waiting_for_database"}'
        values: '1x3 0x12'
      - series: 'kelpie_delivery_startup_recovery_state{job="kelpie-api",instance="api:8000",kelpie_delivery_startup_recovery_state="running"}'
        values: '0x3 1x3 0x8'
      - series: 'kelpie_delivery_startup_recovery_state{job="kelpie-api",instance="api:8000",kelpie_delivery_startup_recovery_state="retrying"}'
        values: '0x7 1x3 0x4'
      - series: 'kelpie_delivery_startup_recovery_state{job="kelpie-api",instance="api:8000",kelpie_delivery_startup_recovery_state="completed"}'
        values: '0x11 1x4'
    alert_rule_test:
      - eval_time: 4m30s
        alertname: KelpieStartupRecoveryStalled
        exp_alerts: []
      - eval_time: 5m
        alertname: KelpieStartupRecoveryStalled
        exp_alerts: &stalled
          - exp_labels: {job: kelpie-api, instance: 'api:8000', severity: warning, component: api}
            exp_annotations:
              summary: Kelpie startup delivery recovery has not completed for five minutes
              summary_ko: Kelpie 시작 시 전달 복구가 5분 동안 완료되지 않았습니다
              runbook_url: https://github.com/haesookimDev/dev-agent/blob/main/docs/en/monitoring-alerts.md#startup-recovery
              runbook_url_ko: https://github.com/haesookimDev/dev-agent/blob/main/docs/ko/monitoring-alerts.md#startup-recovery
      - eval_time: 6m
        alertname: KelpieStartupRecoveryStalled
        exp_alerts: []
      - eval_time: 5m
        alertname: KelpieRecoveryMetricsMissing
        exp_alerts: []

  - name: not started then cancelled while still scrapeable remains unfinished
    input_series:
      - series: 'up{job="kelpie-api",instance="api:8000"}'
        values: '1x12'
      - series: 'kelpie_delivery_startup_recovery_state{job="kelpie-api",instance="api:8000",kelpie_delivery_startup_recovery_state="cancelled"}'
        values: '0x5 1x6'
      - series: 'kelpie_delivery_startup_recovery_state{job="kelpie-api",instance="api:8000",kelpie_delivery_startup_recovery_state="not_started"}'
        values: '1x5 0x6'
      - series: 'kelpie_delivery_startup_recovery_state{job="kelpie-api",instance="api:8000",kelpie_delivery_startup_recovery_state="completed"}'
        values: '0x12'
    alert_rule_test:
      - eval_time: 5m
        alertname: KelpieStartupRecoveryStalled
        exp_alerts: *stalled

  - name: completed startup is healthy and an unavailable scrape suppresses stale recovery
    input_series:
      - series: 'up{job="kelpie-api",instance="api:8000"}'
        values: '1x12'
      - series: 'up{job="kelpie-api",instance="offline:8000"}'
        values: '0x12'
      - series: 'kelpie_delivery_startup_recovery_state{job="kelpie-api",instance="api:8000",kelpie_delivery_startup_recovery_state="completed"}'
        values: '1x12'
      - series: 'kelpie_delivery_startup_recovery_state{job="kelpie-api",instance="api:8000",kelpie_delivery_startup_recovery_state="waiting_for_database"}'
        values: '0x12'
      - series: 'kelpie_delivery_startup_recovery_state{job="kelpie-api",instance="offline:8000",kelpie_delivery_startup_recovery_state="waiting_for_database"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 5m
        alertname: KelpieStartupRecoveryStalled
        exp_alerts: []
      - eval_time: 5m
        alertname: KelpieRecoveryMetricsMissing
        exp_alerts: []

  - name: observed delivery failures alert independently of completed recovery and expire
    input_series:
      - series: 'up{job="kelpie-api",instance="api:8000"}'
        values: '1x30'
      - series: 'kelpie_delivery_startup_recovery_state{job="kelpie-api",instance="api:8000",kelpie_delivery_startup_recovery_state="completed"}'
        values: '1x30'
      - series: 'kelpie_delivery_outcomes_total{job="kelpie-api",instance="api:8000",outcome="failed"}'
        values: '0x3 1x26'
    alert_rule_test:
      - eval_time: 1m30s
        alertname: KelpieDeliveryFailures
        exp_alerts: []
      - eval_time: 2m
        alertname: KelpieDeliveryFailures
        exp_alerts: &failed
          - exp_labels: {job: kelpie-api, instance: 'api:8000', severity: warning, component: api}
            exp_annotations:
              summary: Kelpie delivery failures were observed in the last ten minutes
              summary_ko: 최근 10분 동안 Kelpie 전달 실패가 관찰됐습니다
              runbook_url: https://github.com/haesookimDev/dev-agent/blob/main/docs/en/monitoring-alerts.md#delivery-failures
              runbook_url_ko: https://github.com/haesookimDev/dev-agent/blob/main/docs/ko/monitoring-alerts.md#delivery-failures
      - eval_time: 10m
        alertname: KelpieDeliveryFailures
        exp_alerts: *failed
      - eval_time: 12m
        alertname: KelpieDeliveryFailures
        exp_alerts: []
      - eval_time: 5m
        alertname: KelpieStartupRecoveryStalled
        exp_alerts: []

  - name: counter reset alone is not a new failure and other outcomes and jobs are excluded
    input_series:
      - series: 'up{job="kelpie-api",instance="api:8000"}'
        values: '1x12'
      - series: 'kelpie_delivery_outcomes_total{job="kelpie-api",instance="api:8000",outcome="failed"}'
        values: '5x3 0x3 1x4'
      - series: 'kelpie_delivery_outcomes_total{job="kelpie-api",instance="api:8000",outcome="completed"}'
        values: '0+1x12'
      - series: 'kelpie_delivery_outcomes_total{job="other-api",instance="api:8000",outcome="failed"}'
        values: '0+1x12'
    alert_rule_test:
      - eval_time: 1m
        alertname: KelpieDeliveryFailures
        exp_alerts: []
      - eval_time: 3m
        alertname: KelpieDeliveryFailures
        exp_alerts: []
      - eval_time: 4m
        alertname: KelpieDeliveryFailures
        exp_alerts: *failed

  - name: stale recovery metrics on a live target are missing rather than completed
    input_series:
      - series: 'up{job="kelpie-api",instance="api:8000"}'
        values: '1x12'
      - series: 'kelpie_delivery_startup_recovery_state{job="kelpie-api",instance="api:8000",kelpie_delivery_startup_recovery_state="completed"}'
        values: '1x3 stale'
    promql_expr_test:
      - expr: 'ALERTS{alertname="KelpieRecoveryMetricsMissing",alertstate="firing"}'
        eval_time: 4m
        exp_samples:
          - labels: 'ALERTS{alertname="KelpieRecoveryMetricsMissing",alertstate="firing",job="kelpie-api",instance="api:8000",severity="warning",component="api"}'
            value: 1

  - name: fresh complete empty runtime is observed rather than missing
    input_series:
      - &runtime_up
        series: 'up{job="kelpie-api",instance="api:8000"}'
        values: '1x20'
      - &runtime_available
        series: 'kelpie_runtime_snapshot_available{job="kelpie-api",instance="api:8000"}'
        values: '1x20'
      - &runtime_age
        series: 'kelpie_runtime_snapshot_age_seconds{job="kelpie-api",instance="api:8000"}'
        values: '0x20'
      - &runtime_online
        series: 'kelpie_runtime_workers{job="kelpie-api",instance="api:8000",state="online"}'
        values: '1x20'
      - &runtime_draining
        series: 'kelpie_runtime_workers{job="kelpie-api",instance="api:8000",state="draining"}'
        values: '0x20'
      - &runtime_offline
        series: 'kelpie_runtime_workers{job="kelpie-api",instance="api:8000",state="offline"}'
        values: '0x20'
      - &runtime_quarantined
        series: 'kelpie_runtime_workers{job="kelpie-api",instance="api:8000",state="quarantined"}'
        values: '0x20'
      - &runtime_active
        series: 'kelpie_runtime_leases{job="kelpie-api",instance="api:8000",state="active"}'
        values: '1x20'
      - &runtime_expired
        series: 'kelpie_runtime_leases{job="kelpie-api",instance="api:8000",state="expired"}'
        values: '0x20'
      - &runtime_queued
        series: 'kelpie_runtime_queued_work{job="kelpie-api",instance="api:8000"}'
        values: '0x20'
      - &runtime_oldest
        series: 'kelpie_runtime_queue_oldest_age_seconds{job="kelpie-api",instance="api:8000"}'
        values: '0x20'
    alert_rule_test:
      - {eval_time: 5m, alertname: KelpieRuntimeObservationUnavailable, exp_alerts: []}
      - {eval_time: 5m, alertname: KelpieWorkerHeartbeatLost, exp_alerts: []}
      - {eval_time: 5m, alertname: KelpieActiveLeaseExpired, exp_alerts: []}
      - {eval_time: 5m, alertname: KelpieWorkQueueStalled, exp_alerts: []}
    promql_expr_test:
      - expr: 'kelpie:runtime_snapshot_usable'
        eval_time: 5m
        exp_samples:
          - labels: 'kelpie:runtime_snapshot_usable{job="kelpie-api",instance="api:8000"}'
            value: 1

  - name: heartbeat warning waits two minutes and clears on recovery
    input_series:
      - *runtime_up
      - *runtime_available
      - *runtime_age
      - *runtime_online
      - *runtime_draining
      - <<: *runtime_offline
        values: '1x5 0x14'
      - *runtime_quarantined
      - *runtime_active
      - *runtime_expired
      - *runtime_queued
      - *runtime_oldest
    alert_rule_test:
      - {eval_time: 1m30s, alertname: KelpieWorkerHeartbeatLost, exp_alerts: []}
      - eval_time: 2m
        alertname: KelpieWorkerHeartbeatLost
        exp_alerts:
          - exp_labels: {job: kelpie-api, instance: 'api:8000', severity: warning, component: worker}
            exp_annotations:
              summary: Kelpie has offline workers or lost heartbeats
              summary_ko: Kelpie Worker가 오프라인이거나 Heartbeat가 끊겼습니다
              runbook_url: https://github.com/haesookimDev/dev-agent/blob/main/docs/en/runtime-monitoring.md#heartbeat
              runbook_url_ko: https://github.com/haesookimDev/dev-agent/blob/main/docs/ko/runtime-monitoring.md#heartbeat
      - {eval_time: 3m, alertname: KelpieWorkerHeartbeatLost, exp_alerts: []}
      - {eval_time: 2m, alertname: KelpieRuntimeObservationUnavailable, exp_alerts: []}

  - name: lease warning waits two minutes and clears on recovery
    input_series:
      - *runtime_up
      - *runtime_available
      - *runtime_age
      - *runtime_online
      - *runtime_draining
      - *runtime_offline
      - *runtime_quarantined
      - *runtime_active
      - <<: *runtime_expired
        values: '1x5 0x14'
      - *runtime_queued
      - *runtime_oldest
    alert_rule_test:
      - {eval_time: 1m30s, alertname: KelpieActiveLeaseExpired, exp_alerts: []}
      - eval_time: 2m
        alertname: KelpieActiveLeaseExpired
        exp_alerts:
          - exp_labels: {job: kelpie-api, instance: 'api:8000', severity: warning, component: worker}
            exp_annotations:
              summary: Kelpie has expired lease records that are still active
              summary_ko: Kelpie에 만료됐지만 활성 상태로 남은 Lease가 있습니다
              runbook_url: https://github.com/haesookimDev/dev-agent/blob/main/docs/en/runtime-monitoring.md#lease
              runbook_url_ko: https://github.com/haesookimDev/dev-agent/blob/main/docs/ko/runtime-monitoring.md#lease
      - {eval_time: 3m, alertname: KelpieActiveLeaseExpired, exp_alerts: []}
      - {eval_time: 2m, alertname: KelpieRuntimeObservationUnavailable, exp_alerts: []}

  - name: queue warning waits two minutes and clears on recovery
    input_series:
      - *runtime_up
      - *runtime_available
      - *runtime_age
      - *runtime_online
      - *runtime_draining
      - *runtime_offline
      - *runtime_quarantined
      - *runtime_active
      - *runtime_expired
      - <<: *runtime_queued
        values: '1x5 0x14'
      - <<: *runtime_oldest
        values: '601x5 0x14'
    alert_rule_test:
      - {eval_time: 1m30s, alertname: KelpieWorkQueueStalled, exp_alerts: []}
      - eval_time: 2m
        alertname: KelpieWorkQueueStalled
        exp_alerts:
          - exp_labels: {job: kelpie-api, instance: 'api:8000', severity: warning, component: api}
            exp_annotations:
              summary: Kelpie work has remained queued for more than ten minutes
              summary_ko: Kelpie 작업이 10분 넘게 대기열에 남아 있습니다
              runbook_url: https://github.com/haesookimDev/dev-agent/blob/main/docs/en/runtime-monitoring.md#queue
              runbook_url_ko: https://github.com/haesookimDev/dev-agent/blob/main/docs/ko/runtime-monitoring.md#queue
      - {eval_time: 3m, alertname: KelpieWorkQueueStalled, exp_alerts: []}
      - {eval_time: 2m, alertname: KelpieRuntimeObservationUnavailable, exp_alerts: []}

  - name: failed observation retains data but suppresses domain alerts
    input_series:
      - *runtime_up
      - <<: *runtime_available
        values: '0x20'
      - *runtime_age
      - *runtime_online
      - *runtime_draining
      - <<: *runtime_offline
        values: '1x20'
      - *runtime_quarantined
      - *runtime_active
      - <<: *runtime_expired
        values: '1x20'
      - <<: *runtime_queued
        values: '1x20'
      - <<: *runtime_oldest
        values: '900x20'
    alert_rule_test:
      - eval_time: 2m
        alertname: KelpieRuntimeObservationUnavailable
        exp_alerts: &runtime_unavailable
          - exp_labels: {job: kelpie-api, instance: 'api:8000', severity: warning, component: api}
            exp_annotations:
              summary: Kelpie runtime observation is failed, stale, or incomplete
              summary_ko: Kelpie 실행 상태 관측이 실패했거나 오래됐거나 누락됐습니다
              runbook_url: https://github.com/haesookimDev/dev-agent/blob/main/docs/en/runtime-monitoring.md#observation
              runbook_url_ko: https://github.com/haesookimDev/dev-agent/blob/main/docs/ko/runtime-monitoring.md#observation
      - {eval_time: 2m, alertname: KelpieWorkerHeartbeatLost, exp_alerts: []}
      - {eval_time: 2m, alertname: KelpieActiveLeaseExpired, exp_alerts: []}
      - {eval_time: 2m, alertname: KelpieWorkQueueStalled, exp_alerts: []}

  - name: stale monotonic age is unavailable even if success flag survives
    input_series:
      - *runtime_up
      - *runtime_available
      - <<: *runtime_age
        values: '31x20'
      - *runtime_online
      - *runtime_draining
      - <<: *runtime_offline
        values: '1x20'
      - *runtime_quarantined
      - *runtime_active
      - <<: *runtime_expired
        values: '1x20'
      - <<: *runtime_queued
        values: '1x20'
      - <<: *runtime_oldest
        values: '900x20'
    alert_rule_test:
      - eval_time: 2m
        alertname: KelpieRuntimeObservationUnavailable
        exp_alerts: *runtime_unavailable
      - {eval_time: 2m, alertname: KelpieWorkerHeartbeatLost, exp_alerts: []}
      - {eval_time: 2m, alertname: KelpieActiveLeaseExpired, exp_alerts: []}
      - {eval_time: 2m, alertname: KelpieWorkQueueStalled, exp_alerts: []}

  - name: NaN age is not fresh
    input_series:
      - *runtime_up
      - *runtime_available
      - <<: *runtime_age
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - *runtime_online
      - *runtime_draining
      - <<: *runtime_offline
        values: '1x20'
      - *runtime_quarantined
      - *runtime_active
      - <<: *runtime_expired
        values: '1x20'
      - <<: *runtime_queued
        values: '1x20'
      - <<: *runtime_oldest
        values: '900x20'
    alert_rule_test:
      - eval_time: 2m
        alertname: KelpieRuntimeObservationUnavailable
        exp_alerts: *runtime_unavailable
      - {eval_time: 2m, alertname: KelpieWorkerHeartbeatLost, exp_alerts: []}
      - {eval_time: 2m, alertname: KelpieActiveLeaseExpired, exp_alerts: []}
      - {eval_time: 2m, alertname: KelpieWorkQueueStalled, exp_alerts: []}

  - name: missing observer is not a healthy fleet
    input_series:
      - *runtime_up
      - *runtime_age
      - *runtime_online
      - *runtime_draining
      - <<: *runtime_offline
        values: '1x20'
      - *runtime_quarantined
      - *runtime_active
      - <<: *runtime_expired
        values: '1x20'
      - <<: *runtime_queued
        values: '1x20'
      - <<: *runtime_oldest
        values: '900x20'
    alert_rule_test:
      - eval_time: 2m
        alertname: KelpieRuntimeObservationUnavailable
        exp_alerts: *runtime_unavailable
      - {eval_time: 2m, alertname: KelpieWorkerHeartbeatLost, exp_alerts: []}
      - {eval_time: 2m, alertname: KelpieActiveLeaseExpired, exp_alerts: []}
      - {eval_time: 2m, alertname: KelpieWorkQueueStalled, exp_alerts: []}

  - name: partially relabeled worker metrics are unavailable
    input_series:
      - *runtime_up
      - *runtime_available
      - *runtime_age
      - *runtime_online
      - <<: *runtime_offline
        values: '1x20'
      - *runtime_quarantined
      - *runtime_active
      - <<: *runtime_expired
        values: '1x20'
      - <<: *runtime_queued
        values: '1x20'
      - <<: *runtime_oldest
        values: '900x20'
    alert_rule_test:
      - eval_time: 2m
        alertname: KelpieRuntimeObservationUnavailable
        exp_alerts: *runtime_unavailable
      - {eval_time: 2m, alertname: KelpieWorkerHeartbeatLost, exp_alerts: []}
      - {eval_time: 2m, alertname: KelpieActiveLeaseExpired, exp_alerts: []}
      - {eval_time: 2m, alertname: KelpieWorkQueueStalled, exp_alerts: []}

  - name: partially relabeled lease metrics are unavailable
    input_series:
      - *runtime_up
      - *runtime_available
      - *runtime_age
      - *runtime_online
      - *runtime_draining
      - <<: *runtime_offline
        values: '1x20'
      - *runtime_quarantined
      - <<: *runtime_expired
        values: '1x20'
      - <<: *runtime_queued
        values: '1x20'
      - <<: *runtime_oldest
        values: '900x20'
    alert_rule_test:
      - eval_time: 2m
        alertname: KelpieRuntimeObservationUnavailable
        exp_alerts: *runtime_unavailable
      - {eval_time: 2m, alertname: KelpieWorkerHeartbeatLost, exp_alerts: []}
      - {eval_time: 2m, alertname: KelpieActiveLeaseExpired, exp_alerts: []}
      - {eval_time: 2m, alertname: KelpieWorkQueueStalled, exp_alerts: []}

  - name: missing queue age is unavailable
    input_series:
      - *runtime_up
      - *runtime_available
      - *runtime_age
      - *runtime_online
      - *runtime_draining
      - <<: *runtime_offline
        values: '1x20'
      - *runtime_quarantined
      - *runtime_active
      - <<: *runtime_expired
        values: '1x20'
      - <<: *runtime_queued
        values: '1x20'
    alert_rule_test:
      - eval_time: 2m
        alertname: KelpieRuntimeObservationUnavailable
        exp_alerts: *runtime_unavailable
      - {eval_time: 2m, alertname: KelpieWorkerHeartbeatLost, exp_alerts: []}
      - {eval_time: 2m, alertname: KelpieActiveLeaseExpired, exp_alerts: []}
      - {eval_time: 2m, alertname: KelpieWorkQueueStalled, exp_alerts: []}

  - name: stale series marker is unavailable
    input_series:
      - *runtime_up
      - <<: *runtime_available
        values: '1x3 stale'
      - *runtime_age
      - *runtime_online
      - *runtime_draining
      - <<: *runtime_offline
        values: '1x20'
      - *runtime_quarantined
      - *runtime_active
      - <<: *runtime_expired
        values: '1x20'
      - <<: *runtime_queued
        values: '1x20'
      - <<: *runtime_oldest
        values: '900x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: KelpieRuntimeObservationUnavailable
        exp_alerts: *runtime_unavailable
      - {eval_time: 4m, alertname: KelpieWorkerHeartbeatLost, exp_alerts: []}
      - {eval_time: 4m, alertname: KelpieActiveLeaseExpired, exp_alerts: []}
      - {eval_time: 4m, alertname: KelpieWorkQueueStalled, exp_alerts: []}

  - name: unavailable scrape takes precedence over stale runtime data
    input_series:
      - <<: *runtime_up
        values: '0x20'
      - *runtime_available
      - *runtime_age
      - *runtime_online
      - *runtime_draining
      - *runtime_offline
      - *runtime_quarantined
      - *runtime_active
      - *runtime_expired
      - *runtime_queued
      - *runtime_oldest
    alert_rule_test:
      - {eval_time: 3m, alertname: KelpieRuntimeObservationUnavailable, exp_alerts: []}
      - {eval_time: 3m, alertname: KelpieWorkerHeartbeatLost, exp_alerts: []}
      - {eval_time: 3m, alertname: KelpieActiveLeaseExpired, exp_alerts: []}
      - {eval_time: 3m, alertname: KelpieWorkQueueStalled, exp_alerts: []}

  - name: restored complete observation clears its warning
    input_series:
      - *runtime_up
      - <<: *runtime_available
        values: '0x5 1x14'
      - *runtime_age
      - *runtime_online
      - *runtime_draining
      - *runtime_offline
      - *runtime_quarantined
      - *runtime_active
      - *runtime_expired
      - *runtime_queued
      - *runtime_oldest
    alert_rule_test:
      - {eval_time: 1m30s, alertname: KelpieRuntimeObservationUnavailable, exp_alerts: []}
      - {eval_time: 2m, alertname: KelpieRuntimeObservationUnavailable, exp_alerts: *runtime_unavailable}
      - {eval_time: 3m, alertname: KelpieRuntimeObservationUnavailable, exp_alerts: []}

  - name: exact freshness and queue boundaries and quarantined draining workers are not failures
    input_series:
      - *runtime_up
      - *runtime_available
      - <<: *runtime_age
        values: '30x20'
      - *runtime_online
      - <<: *runtime_draining
        values: '2x20'
      - *runtime_offline
      - <<: *runtime_quarantined
        values: '3x20'
      - *runtime_active
      - *runtime_expired
      - <<: *runtime_queued
        values: '1x20'
      - <<: *runtime_oldest
        values: '600x20'
    alert_rule_test:
      - {eval_time: 5m, alertname: KelpieRuntimeObservationUnavailable, exp_alerts: []}
      - {eval_time: 5m, alertname: KelpieWorkerHeartbeatLost, exp_alerts: []}
      - {eval_time: 5m, alertname: KelpieActiveLeaseExpired, exp_alerts: []}
      - {eval_time: 5m, alertname: KelpieWorkQueueStalled, exp_alerts: []}

  - name: other target or job metrics cannot fill a missing contract
    input_series:
      - *runtime_up
      - *runtime_available
      - series: 'kelpie_runtime_snapshot_age_seconds{job="kelpie-api",instance="other:8000"}'
        values: '0x20'
      - series: 'kelpie_runtime_snapshot_age_seconds{job="other-api",instance="api:8000"}'
        values: '0x20'
      - *runtime_online
      - *runtime_draining
      - *runtime_offline
      - *runtime_quarantined
      - *runtime_active
      - *runtime_expired
      - *runtime_queued
      - *runtime_oldest
    alert_rule_test:
      - {eval_time: 2m, alertname: KelpieRuntimeObservationUnavailable, exp_alerts: *runtime_unavailable}
