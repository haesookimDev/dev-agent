        eval_time: 2m
        exp_samples:
          - {labels: 'ALERTS{alertname="KelpieExecutionObservationUnavailable",alertstate="firing",job="kelpie-api",instance="api:8000",severity="warning",component="api"}', value: 1}
      - expr: 'ALERTS{alertname="KelpieExecutionPhaseStalled",alertstate="firing"}'
        eval_time: 2m
        exp_samples: []
      - expr: 'ALERTS{alertname="KelpieDeliveryJobStalled",alertstate="firing"}'
        eval_time: 2m
        exp_samples: []
      - expr: 'ALERTS{alertname="KelpieWorkerHeartbeatLost",alertstate="firing"}'
        eval_time: 2m
        exp_samples:
          - {labels: 'ALERTS{alertname="KelpieWorkerHeartbeatLost",alertstate="firing",job="kelpie-api",instance="api:8000",severity="warning",component="worker"}', value: 1}

    alert_rule_test:
      - eval_time: 2m
        alertname: KelpieExecutionObservationUnavailable
        exp_alerts:
          - exp_labels: {job: kelpie-api, instance: 'api:8000', severity: warning, component: api}
            exp_annotations: &execution_unavailable_annotations
              summary: Kelpie execution or delivery observations are invalid or incomplete
              summary_ko: Kelpie 실행 단계 또는 전달 관측 지표가 유효하지 않거나 누락됐습니다
              runbook_url: https://github.com/haesookimDev/dev-agent/blob/main/docs/en/execution-monitoring.md#observation
              runbook_url_ko: https://github.com/haesookimDev/dev-agent/blob/main/docs/ko/execution-monitoring.md#observation

  - name: missing execution_verifying_age blocks stall alerts but retains Worker observation
    interval: 30s
    input_series:
      - *up
      - *available
      - *age
      - *worker_online
      - *worker_draining
      - {<<: *worker_offline, values: '1x20'}
      - *worker_quarantined
      - *lease_active
      - *lease_expired
      - *queue
      - *queue_age
      - *execution_provisioning_count
      - *execution_provisioning_age
      - *execution_analyzing_count
      - *execution_analyzing_age
      - {<<: *execution_implementing_count, values: '1x20'}
      - {<<: *execution_implementing_age, values: '1801x20'}
      - *execution_verifying_count
      - *execution_committing_count
      - *execution_committing_age
      - *execution_pr_created_count
      - *execution_pr_created_age
      - *delivery_pending_count
      - *delivery_pending_age
      - *delivery_retry_count
      - *delivery_retry_age
      - {<<: *delivery_running_count, values: '1x20'}
      - {<<: *delivery_running_age, values: '601x20'}
      - *delivery_completed_count
      - *delivery_completed_age
      - *delivery_failed_count
      - *delivery_failed_age
      - *delivery_unknown_count
